name: Ubuntu Debian packages

on:
  push:
    branches: [fix/gobgp-api-compat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.repository == 'nuclearcat/rustybgp'
    name: Ubuntu ${{ matrix.ubuntu }} amd64
    runs-on: ubuntu-24.04
    # The 26.04 hosted runner uses amd64v3 packages, including a GCC that
    # defaults to x86-64-v3. Use the baseline distribution for every input
    # to the build, including startup objects and static libraries.
    container: ubuntu:${{ matrix.ubuntu }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    env:
      CARGO_TERM_COLOR: always
      RUST_TOOLCHAIN: '1.97.1'
      RUSTFLAGS: '-C target-cpu=x86-64'
      CFLAGS: '-march=x86-64 -mtune=generic'
      CXXFLAGS: '-march=x86-64 -mtune=generic'
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      DEB_MAINTAINER: '${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>'
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential protobuf-compiler libprotobuf-dev dpkg-dev debhelper systemd \
            ca-certificates curl git python3 qemu-user
          if dpkg-query -W -f='${Package} ${Architecture-Variant}\n' | grep -w amd64v3; then
            echo 'Refusing to build baseline packages with amd64v3 dependencies' >&2
            exit 1
          fi
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Trust the runner-mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: Swatinem/rust-cache@v2
        with:
          key: deb-baseline-amd64-v1-ubuntu-${{ matrix.ubuntu }}

      - name: Resolve dependencies and set package version
        run: |
          cargo generate-lockfile
          python3 - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          revision = subprocess.check_output(['git', 'rev-parse', '--short=10', 'HEAD'], text=True).strip()
          timestamp = subprocess.check_output(['git', 'show', '-s', '--format=%ct', 'HEAD'], text=True).strip()
          version += f"+git{timestamp}.{revision}-1ubuntu{os.environ['UBUNTU_VERSION']}.{os.environ['GITHUB_RUN_NUMBER']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'DEB_VERSION={version}\n')
          PY

      - name: Test and build
        run: |
          cargo test --workspace --locked
          cargo build --release --locked -p rustybgpd

      - name: Build Debian package
        run: |
          bash packaging/build-deb.sh
          cp Cargo.lock "target/debian/Cargo-ubuntu-${UBUNTU_VERSION}.lock"

      - name: Install and smoke-test package
        run: |
          apt-get install -y ./target/debian/*.deb
          /usr/bin/rustybgpd --version
          /usr/bin/rustybgpd --help
          systemd-analyze verify /usr/lib/systemd/system/rustybgpd.service
          test "$(systemctl is-enabled rustybgpd.service || true)" = disabled
          test -f /usr/share/rustybgpd/examples/rustybgpd.yaml
          test ! -e /etc/rustybgpd/rustybgpd.yaml

      - name: Smoke-test package without AVX
        run: |
          qemu-x86_64 -cpu Nehalem /usr/bin/rustybgpd --version
          qemu-x86_64 -cpu Nehalem /usr/bin/rustybgpd --help

      - uses: actions/upload-artifact@v4
        with:
          name: rustybgpd-ubuntu-${{ matrix.ubuntu }}-amd64
          path: |
            target/debian/*.deb
            target/debian/*.sha256
            target/debian/*.lock
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Publish downloadable packages
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rustybgpd-ubuntu-*-amd64
          path: packages
          merge-multiple: true

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="ubuntu-debs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          debs=(packages/*.deb)
          package_version=$(dpkg-deb -f "${debs[0]}" Version)
          version=${package_version%%+*}
          cat > release-notes.md <<EOF
          Debian packages for Ubuntu 24.04 and 26.04 (baseline amd64).

          Fixes the unintended x86-64-v3 requirement in the Ubuntu 26.04 package.
          Built with baseline Rust and C CPU targets in standard Ubuntu containers.
          Both packages pass --version and --help under an emulated Nehalem CPU without AVX.

          Includes rustybgpd.service, installed disabled and stopped until configured.
          See the README for configuration and service startup instructions.

          Built from commit ${GITHUB_SHA}. SHA-256 checksums are included.
          EOF
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Ubuntu packages ${version} (build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" \
            --notes-file release-notes.md \
            --prerelease \
            packages/*.deb packages/*.sha256
